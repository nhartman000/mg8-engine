name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-wheel-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and test installed wheels (no editable dependencies)
        run: python -I scripts/clean_wheel.py --work-dir "$RUNNER_TEMP/mg8-clean-wheel"
