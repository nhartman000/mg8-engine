[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mg8-engine"
version = "0.3.0"
description = "Reference MG8 runtime profile with canonical file-family loading and optional Nych/ADSR/TOTE extensions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "click>=8.1",
    "google-genai>=1.0",
]

[project.scripts]
mg8-run = "mg8_engine.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mg8_engine*"]
namespaces = false

[tool.setuptools]
py-modules = []
