[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mg8-engine"
version = "0.2.0"
description = "Minimal deterministic execution engine with Nych symbolic protocol and ADSR gating"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
]

[project.scripts]
mg8-run = "mg8_engine.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mg8_engine*"]
namespaces = false

[tool.setuptools]
py-modules = []