[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mg8-engine"
version = "0.3.0"
description = "Reference MG8 runtime profile with canonical file-family loading and optional Nych/ADSR/TOTE extensions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "click>=8.1",
    "google-genai>=1.0",
    "nych @ git+https://github.com/nhartman000/nych.git@57b81e9220069dd5ff72197b41288c9613e3343b",
    "tcta-engine @ git+https://github.com/nhartman000/TCTA.git@f2882c131e3e220d1cf1c9b7448625aabd51a85f",
]

[project.scripts]
mg8-run = "mg8_engine.cli:cli"
mg8-response = "mg8_engine.response_contract:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mg8_engine*"]
namespaces = false

[tool.setuptools]
py-modules = []
